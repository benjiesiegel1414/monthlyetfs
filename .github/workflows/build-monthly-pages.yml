name: Build Monthly ETF Pages

on:
  schedule:
    - cron: '15 6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/build-etf-images.mjs'
      - 'scripts/build-monthly-pages.js'
      - 'scripts/site-chrome.mjs'
      - 'scripts/build-breakdowns.mjs'
      - '.github/workflows/build-monthly-pages.yml'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'How many fund pages to build (0 = all funds in the sheet)'
        required: false
        default: '25'

permissions:
  contents: write

concurrency:
  group: build-monthly-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build evergreen ETF ticker images
        run: |
          npm i --no-save --no-package-lock --no-audit --no-fund satori@0.35.0 @resvg/resvg-js@2.6.2 @fontsource/lato@5.3.0
          node scripts/build-etf-images.mjs
          rm -rf node_modules

      - name: Build pages from Google Sheets CSV
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '25' }}
        run: node scripts/build-monthly-pages.js

      - name: Build fund breakdown pages (/etf/<sym>/<metric>)
        run: node scripts/build-breakdowns.mjs

      # OVL sponsor banners (top and bottom) and the network footer on every page
      - name: Apply site banners and footer
        run: node scripts/site-chrome.mjs

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "*.html" sitemap.xml etf-images etf
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "Auto-rebuild monthly ETF pages ($(date -u +%Y-%m-%d))"
            git push
          fi
