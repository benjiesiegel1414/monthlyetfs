name: One-time - add TopETFs to network bar and footer

# Adds TopETFs.com to the end of the "Our Sites" network bar and network footer on every page
# (and in the page generators), commits, then deletes this workflow file.
on:
  push:
    paths: [".github/workflows/add-topetfs-link.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add TopETFs links
        run: |
          cat > /tmp/add_topetfs.py <<'PY'
          #!/usr/bin/env python3
          """Add TopETFs.com to the end of the "Our Sites" network bar and to network-link footers.
          Runs on every .html/.js/.mjs file in the repo (generators too, so future builds keep it).
          Idempotent: skips any bar or footer that already links to topetfs.com."""
          import os, re, sys

          NET = ('topdividendetfs.com', 'weeklyetfs.com', 'monthlyetfs.com', 'growthetfs.com', 'etftotalreturns.com',
                 'topdividendtools.com', 'topdividendetfspro.com', 'dividendprojection.com', 'photonicsetfs.com')
          TITLE = 'ETF news, research and live data'
          stats = {'bar': 0, 'footer': 0, 'files': 0}


          def fix_bars(s):
              out, pos, n = [], 0, 0
              for m in re.finditer(r'class="[^"]*\b(?:site-network-track|network-bar-links|network-bar-inner)\b[^"]*"', s):
                  if m.start() < pos:
                      continue
                  end = s.find('</div>', m.end())
                  if end < 0:
                      break
                  block = s[m.start():end]
                  if 'topetfs.com' in block or '<a ' not in block:
                      continue
                  last_a = block.rfind('</a>')
                  if last_a < 0:
                      continue
                  ins_at = m.start() + last_a + 4
                  a_open = block.rfind('<a ', 0, last_a)
                  line_start = s.rfind('\n', 0, m.start() + a_open) + 1
                  indent = re.match(r'[ \t]*', s[line_start:]).group(0)
                  last_tag = block[a_open:last_a + 4]
                  if 'pill' not in last_tag[:last_tag.find('>')] and 'network-bar-links' not in m.group(0):
                      continue
                  if 'network-bar-links' in m.group(0):
                      # copy a plain external link, not the highlighted current-page one
                      ext = [x for x in re.finditer(r'<a\b[^>]*>', block) if 'current' not in x.group(0)]
                      if ext:
                          last_tag = ext[-1].group(0) + '</a>'
                  opening = last_tag[:last_tag.find('>') + 1]
                  opening = re.sub(r'\s*class="[^"]*current[^"]*"', '', opening)
                  if 'network-bar-links' in m.group(0):
                      opening = '<a href="https://topetfs.com/" target="_blank">'
                  opening = re.sub(r'\s*data-[a-z-]+="[^"]*"', '', opening)
                  opening = re.sub(r'href="[^"]*"', 'href="https://topetfs.com/"', opening)
                  opening = re.sub(r'title="[^"]*"', f'title="{TITLE}"', opening)
                  inner = '<span class="pill-emoji">📰</span> TopETFs.com' if 'pill-emoji' in last_tag else '📰 TopETFs.com'
                  pill = opening + inner + '</a>'
                  sep = ('\n' + indent) if s[line_start:m.start() + a_open].strip() == '' else ''
                  out.append(s[pos:ins_at] + sep + pill)
                  pos = ins_at
                  n += 1
              out.append(s[pos:])
              return ''.join(out), n


          def fix_footers(s, own):
              n = 0
              def repl(m):
                  nonlocal n
                  f = m.group(0)
                  if 'topetfs.com' in f:
                      return f
                  links = list(re.finditer(r'<a\b[^>]*href="https?://(?:www\.)?([a-z]+\.com)/?[^"]*"[^>]*>.*?</a>', f, re.S))
                  def plain(l):
                      t = l.group(0); opening = t[:t.find('>') + 1]
                      text = re.sub(r'<[^>]+>', '', t).strip()
                      return ('style=' not in opening and '<img' not in t and 'btn' not in opening and 'button' not in opening
                              and 0 < len(text) <= 40 and '\n' not in t)
                  netlinks = [l for l in links if l.group(1) in NET and l.group(1) != own and plain(l)]
                  if len(netlinks) < 2:
                      return f
                  last = netlinks[-1]
                  prev = netlinks[-2]
                  between = f[prev.end():last.start()]
                  if re.search(r'[A-Za-z]{3,}', re.sub(r'<[^>]+>|&[a-z]+;', '', between)):
                      return f  # links sit inside a sentence, leave it alone
                  if '·' in between or '&middot;' in between:
                      sep = ' · '
                  elif '|' in between or '<br' in between:
                      sep = ' | '
                  elif '\n' in between:
                      sep = '\n' + re.search(r'[ \t]*$', between).group(0)
                  else:
                      sep = ' '
                  tag = last.group(0)
                  attrs = ' target="_blank" rel="noopener"' if 'target="_blank"' in tag else ''
                  cls = re.search(r'class="[^"]*"', prev.group(0)[:prev.group(0).find('>')])
                  cls = ' ' + cls.group(0) if cls else ''
                  link = f'<a href="https://topetfs.com/"{cls}{attrs}>TopETFs</a>'
                  n += 1
                  return f[:last.end()] + sep + link + f[last.end():]
              s2 = re.sub(r'<footer\b[\s\S]*?</footer>', repl, s)
              return s2, n


          def main(root, own):
              for dp, dn, fn in os.walk(root):
                  dn[:] = [d for d in dn if d not in ('.git', 'node_modules')]
                  for f in fn:
                      if not f.endswith(('.html', '.js', '.mjs')):
                          continue
                      p = os.path.join(dp, f)
                      try:
                          s = open(p, encoding='utf-8').read()
                      except Exception:
                          continue
                      s2, b = fix_bars(s)
                      s3, ft = fix_footers(s2, own)
                      if s3 != s:
                          open(p, 'w', encoding='utf-8').write(s3)
                          stats['files'] += 1
                          stats['bar'] += b
                          stats['footer'] += ft
              print(stats)


          if __name__ == '__main__':
              main(sys.argv[1] if len(sys.argv) > 1 else '.', sys.argv[2] if len(sys.argv) > 2 else '')

          PY
          OWN=$(tr -d '\r\n' < CNAME | sed 's/^www\.//')
          python3 /tmp/add_topetfs.py . "$OWN"
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/add-topetfs-link.yml
          git add -A
          git commit -m "Add TopETFs.com to the network bar and footer"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
